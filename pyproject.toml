[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-modal-rag"
version = "0.1.0"
description = "Multimodal RAG that answers only from defined data sources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-text-splitters",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "symspellpy",
    "pillow",
    "openai-whisper",
    "numpy",
    "google-genai",
    "openai",
    "pdfplumber",
    "pypdf",
    "chromadb",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*"]