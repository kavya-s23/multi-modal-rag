<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Q&amp;A</title>

<style>
  button.chip { font: inherit; font-size: 12.5px; cursor: pointer; }
button.chip:hover, button.chip.on { border-color: var(--accent); }
sup.c { cursor: pointer; }
.ev { display: none; margin-top: 10px; background: var(--card); border: 1px solid var(--line);
      border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 14px;
      font-size: 14px; white-space: normal; }
.ev.open { display: block; }
.ev .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.ev .sup { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
.ev pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px;
          overflow-y: auto; font: inherit; }
:root {
  --bg: #faf9f5; --panel: #f0eee6; --card: #ffffff; --text: #1f1e1d; --muted: #6b6a68;
  --line: #e3e0d6; --accent: #c15f3c; --accent-text: #ffffff; --user: #ece9df;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #262624; --panel: #1f1e1d; --card: #30302e; --text: #f0eee6; --muted: #a09e96;
          --line: #3d3d3a; --accent: #d97757; --accent-text: #1f1e1d; --user: #393937;
          color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; background: var(--bg); color: var(--text);
       font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
aside { width: 280px; background: var(--panel); border-right: 1px solid var(--line);
        padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.brand { font: 600 20px Georgia, serif; }
button { font: inherit; cursor: pointer; }
.new { background: var(--card); color: var(--text); border: 1px solid var(--line);
       border-radius: 10px; padding: 9px 12px; text-align: left; }
.new:hover { border-color: var(--accent); }
.new:disabled { opacity: .5; cursor: default; }
h3 { margin: 6px 0 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.doc { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 8px;
       font-size: 14px; cursor: pointer; line-height: 1.35; }
.doc:hover { background: var(--user); }
.doc input { margin-top: 3px; accent-color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chat { flex: 1; overflow-y: auto; padding: 28px 16px; }
.col { max-width: 760px; margin: 0 auto; }
.empty { text-align: center; margin-top: 18vh; }
.empty h1 { font: 400 34px Georgia, serif; margin: 0 0 8px; }
.empty p { color: var(--muted); margin: 0; }
.msg { margin: 0 0 22px; display: flex; }
.msg.user { justify-content: flex-end; }
.bubble { max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.user .bubble { background: var(--user); padding: 10px 16px; border-radius: 18px; }
.bot .bubble { max-width: 100%; }
sup.c { background: var(--user); color: var(--accent); border-radius: 6px; padding: 0 5px;
        font-size: 11px; font-weight: 600; margin: 0 1px; }
.cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
        padding: 3px 10px; background: var(--card); }
.chip b { color: var(--accent); margin-right: 4px; }
.note { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; width: 100%; }
.card input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--bg);
       border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0 10px; }
.row { display: flex; gap: 8px; }
.btn { border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.dots span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%;
             background: var(--muted); animation: b 1s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
@keyframes b { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
footer { padding: 0 16px 18px; }
.composer { max-width: 760px; margin: 0 auto; background: var(--card); border: 1px solid var(--line);
            border-radius: 20px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.composer:focus-within { border-color: var(--accent); }
textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
           font: inherit; max-height: 180px; }
.bar { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.icon { width: 34px; height: 34px; border-radius: 10px; border: 0; background: transparent;
        color: var(--muted); font-size: 18px; }
.icon:hover { background: var(--user); }
.file { font-size: 13px; background: var(--user); border-radius: 999px; padding: 2px 6px 2px 12px; }
.file button { border: 0; background: none; color: var(--muted); }
.send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 0;
        background: var(--accent); color: var(--accent-text); font-size: 16px; }
.send:disabled { opacity: .4; cursor: default; }
.small { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
@media (max-width: 760px) { aside { display: none; } }
</style>
</head>
<body>
<aside>
  <div class="brand">Document Q&amp;A</div>
  <button class="new" id="new">+ New chat</button>
  <button class="new" id="addDocs">&#8679; Add documents</button>
  <input type="file" id="docPick" accept=".pdf,.docx,.txt" multiple hidden>
  <h3>Search in (max 5)</h3>
  <div id="docs"></div>
  <div class="hint" id="hint"></div>
</aside>

<main>
  <div id="chat"><div class="col" id="msgs"></div></div>
  <footer>
    <div class="composer">
      <textarea id="box" rows="1" placeholder="Ask about your documents"></textarea>
      <div class="bar">
        <button class="icon" id="attach" title="Attach an image or audio file for your question">+</button>
        <input type="file" id="pick" accept="image/*,audio/*" hidden>
        <span id="fileTag"></span>
        <button class="send" id="send" title="Send">&#8593;</button>
      </div>
    </div>
    <div class="small">Answers come only from the selected documents.</div>
  </footer>
</main>

<script>
const $ = s => document.querySelector(s);
let thread = crypto.randomUUID(), file = null, busy = false;
const selected = new Set();

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\[(\d+)\]/g, '<sup class="c" data-n="$1">$1</sup>');

function emptyState() {
  $("#msgs").innerHTML = '<div class="empty"><h1>What would you like to know?</h1>' +
    '<p>Add or pick documents on the left, then ask a question.</p></div>';
}

function add(role, html) {
  const e = $("#msgs .empty"); if (e) e.remove();
  const m = document.createElement("div");
  m.className = "msg " + role;
  m.innerHTML = '<div class="bubble">' + html + "</div>";
  $("#msgs").appendChild(m);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return m;
}

async function loadDocs() {
  const docs = await (await fetch("/api/documents")).json();
  $("#docs").innerHTML = "";
  if (!docs.length) { $("#hint").textContent = "Nothing is indexed yet. Add documents above."; return; }
  for (const d of docs) {
    const l = document.createElement("label");
    l.className = "doc";
    l.innerHTML = '<input type="checkbox"><span>' + esc(d.name) + "</span>";
    const cb = l.querySelector("input");
    cb.checked = selected.has(d.id);
    cb.onchange = () => {
      if (cb.checked && selected.size >= 5) { cb.checked = false; return; }
      cb.checked ? selected.add(d.id) : selected.delete(d.id);
      $("#hint").textContent = selected.size ? "" : "Select at least one document.";
    };
    $("#docs").appendChild(l);
  }
  if (!selected.size) $("#hint").textContent = "Select at least one document.";
}

// ---------- add documents ----------
$("#addDocs").onclick = () => $("#docPick").click();
$("#docPick").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  if (!files.length) return;
  const fd = new FormData(); files.forEach(f => fd.append("files", f));
  $("#addDocs").disabled = true;
  $("#hint").textContent = "Uploading...";
  try {
    const r = await fetch("/api/ingest", {method: "POST", body: fd});
    if (!r.ok) throw new Error((await r.json()).detail || "Upload failed.");
    const {job} = await r.json();
    for (;;) {
      await new Promise(res => setTimeout(res, 2000));
      const s = await (await fetch("/api/ingest/" + job)).json();
      if (!s.done) { $("#hint").textContent = "Indexing... this can take a few minutes."; continue; }
      const bits = [];
      if (s.ingested.length) bits.push("Added: " + s.ingested.join(", "));
      if (s.skipped.length) bits.push("Already indexed: " + s.skipped.join(", "));
      if (s.incomplete.length) bits.push("Incomplete (add again to retry): " + s.incomplete.join(", "));
      if (s.failed.length) bits.push("Failed: " + s.failed.map(f => f[0] + " (" + f[1] + ")").join("; "));
      await loadDocs();
      $("#hint").textContent = bits.join(" | ");
      break;
    }
  } catch (err) { $("#hint").textContent = err.message; }
  $("#addDocs").disabled = false;
};

// ---------- chat ----------
function show(reply, holder) {
  holder.remove();
    if (reply.status === "answer") {
        const kind = {image: "Image description", table: "Table", outline: "Document outline"};
    const chips = reply.citations.map(c =>
      '<button class="chip" data-n="' + c.n + '"><b>' + c.n + "</b>" + esc(String(c.doc)) +
      ", p." + c.page + (c.section ? " (" + esc(c.section) + ")" : "") + "</button>").join("");
    const evid = reply.citations.map(c =>
      '<div class="ev" data-n="' + c.n + '"><div class="lab">' + (kind[c.type] || "Excerpt") +
      " from " + esc(String(c.doc)) + ", p." + c.page + "</div>" +
      (c.sentences.length ? '<div class="sup">Supports: ' + c.sentences.map(esc).join(" ") + "</div>" : "") +
      "<pre>" + esc(c.text) + "</pre></div>").join("");
    const m = add("bot", fmt(reply.answer) + '<div class="cites">' + chips + "</div>" + evid);
    const toggle = n => {
      m.querySelectorAll(".ev").forEach(e => e.classList.toggle("open", e.dataset.n === n && !e.classList.contains("open")));
      m.querySelectorAll("button.chip").forEach(b => b.classList.toggle("on", b.dataset.n === n &&
        m.querySelector('.ev[data-n="' + n + '"]').classList.contains("open")));
    };
    m.querySelectorAll("button.chip, sup.c").forEach(el => el.onclick = () => toggle(el.dataset.n));
  }else if (reply.status === "confirm") {
    const m = add("bot", '<div class="card">Is this what you said? Edit it if needed.' +
      '<input type="text"><div class="row"><button class="btn primary">Confirm</button>' +
      '<button class="btn">Cancel</button></div></div>');
    const inp = m.querySelector("input"); inp.value = reply.transcript;
    const [ok, no] = m.querySelectorAll("button");
    ok.onclick = () => confirmIt(m, true, inp.value);
    no.onclick = () => confirmIt(m, false, "");
    return;
  } else {
    add("bot", '<span class="note">' + esc(reply.message || "Something went wrong.") + "</span>");
  }
  setBusy(false);
}

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"},
                              body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

async function confirmIt(card, yes, text) {
  card.remove();
  const wait = add("bot", '<div class="dots"><span></span><span></span><span></span></div>');
  try { show(await post("/api/confirm", {thread, confirmed: yes, text}), wait); }
  catch (e) { show({status: "error", message: e.message}, wait); }
}

function setBusy(v) { busy = v; $("#send").disabled = v; }

async function send() {
  const text = $("#box").value.trim();
  if (busy) return;
  if (!selected.size) { $("#hint").textContent = "Select at least one document."; return; }
  if (file && !/^(image|audio)\//.test(file.type)) {
    $("#hint").textContent = "The + button is for an image or audio question. Use Add documents for PDF, DOCX or TXT.";
    clearFile(); return;
  }
  const kind = file ? (file.type.startsWith("audio") ? "audio" : "image") : "text";
  if (kind !== "audio" && !text) return;

  setBusy(true);
  add("user", esc(text || "Audio: " + file.name) + (file && text ? "<br><i>(" + esc(file.name) + ")</i>" : ""));
  $("#box").value = ""; $("#box").style.height = "auto";
  const wait = add("bot", '<div class="dots"><span></span><span></span><span></span></div>');
  try {
    let id = null;
    if (file) {
      const fd = new FormData(); fd.append("file", file);
      const up = await fetch("/api/upload", {method: "POST", body: fd});
      if (!up.ok) throw new Error("Upload failed.");
      id = (await up.json()).file;
    }
    show(await post("/api/chat", {thread, doc_ids: [...selected], modality: kind, text, file: id}), wait);
  } catch (e) { show({status: "error", message: e.message}, wait); }
  clearFile();
}

function clearFile() { file = null; $("#pick").value = ""; $("#fileTag").innerHTML = ""; }

$("#attach").onclick = () => $("#pick").click();
$("#pick").onchange = e => {
  file = e.target.files[0] || null;
  $("#fileTag").innerHTML = file ? '<span class="file">' + esc(file.name) + ' <button>&times;</button></span>' : "";
  if (file) $("#fileTag button").onclick = clearFile;
};
$("#send").onclick = send;
$("#box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#box").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("#new").onclick = () => { thread = crypto.randomUUID(); clearFile(); setBusy(false); emptyState(); };

emptyState();
loadDocs();
</script>
</body>
</html>
